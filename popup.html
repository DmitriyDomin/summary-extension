<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="custom-select.css">
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary Extension</title>
</head>
<body>
<div class="header">
    <h1 id="summarizeHeader" data-i18n="extensionName"></h1>
    <div class="language-picker custom-select">
        <select id="userLanguage">
            <option value="en" class="option-en language-option"></option>
            <option value="es" class="option-es language-option"></option>
            <option value="fr" class="option-fr language-option"></option>
            <option value="de" class="option-de language-option"></option>
            <option value="it" class="option-it language-option"></option>
            <option value="pt" class="option-pt language-option"></option>
            <option value="ua" class="option-ua language-option"></option>
            <option value="ru" class="option-ru language-option"></option>
        </select>
    </div>
</div>
<div class="target-language-container">
    <label for="targetLanguage" data-i18n="targetLanguage" class="target-language-label">Translate to</label>
    <div class="custom-select target-language">
        <select id="targetLanguage" >
            <option value="none" id="noTranslation" data-i18n="noTranslation">No translation</option>
            <option value="english" data-i18n="english" >English</option>
            <option value="spanish" data-i18n="spanish">Spanish</option>
            <option value="german" data-i18n="german">German</option>
            <option value="french" data-i18n="french">French</option>
            <option value="italian" data-i18n="italian">Italian</option>
            <option value="portuguese" data-i18n="portuguese">Portuguese</option>
            <option value="russian" data-i18n="russian">Russian</option>
            <option value="ukrainian" data-i18n="ukrainian">Ukrainian</option>
        </select>
    </div>
</div>

<div class="summary-length-container">
    <label for="summaryLength" id="summaryLengthLabel" data-i18n="summaryLengthLabel">Summary Length:</label>
    <div class="custom-select summary-length">
        <select id="summaryLength">
            <option value="short" id="shortText" data-i18n="shortText">Short</option>
            <option value="medium" id="mediumText" data-i18n="mediumText">Medium</option>
            <option value="long" id="longText" data-i18n="longText">Long</option>
        </select>
    </div>
</div>

<button id="summarizeWebpageButton" data-i18n="summarizeWebpageButton" class="summarize-webpage button"></button>

<div class="instant-summary-container">
    <div class="instant-summary-toggle closed" id="instantSummaryToggle">Insert text to summarize</div>
    <div class="instant-summary">
        <textarea name="instantSummaryTextarea" class="instant-summary__textarea" id="instantSummaryTextarea"></textarea>
        <button class="instant-summary__button" id="instantSummaryButton">&#8594</button>
    </div>
</div>


<div id="summary"></div>
<div class="save-content-container">
    <div class="save-content-tags">
        <label for="tags" id="tagsLabel" data-i18n="tagsLabel">Tags:</label>
        <input type="text" id="tags" data-i18n="tags" placeholder="Enter tags separated by commas" class="save-content-input">
    </div>
    <button id="saveButton" data-i18n="saveButton" class="save-content-button button">Save Summary</button>
</div>
<div id="savedSummaries"></div>
<div class="share-container">
    <button id="shareEmail" data-i18n="shareEmail"  class="button-email button">Share via Email</button>
    <button id="shareTwitter" data-i18n="shareTwitter" class="button-twitter button">Share on Twitter</button>
</div>
<script src="load-scripts.js"></script>
</body>
</html>
